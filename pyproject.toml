[project]
name = "hiddify_support_bot"
dynamic = ["version"]
description = "Awesome hiddify_support_bot created by hiddify"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "hiddify" }]
urls = { Homepage = "https://github.com/hiddify/hiddify_support_bot/" }
dependencies = [
    "i18nice==0.15.5",
    "pyTelegramBotAPI==4.21.0",
    "aiohttp==3.13.5",
    "python-dotenv==1.0.1",
    "asyncssh==2.15.0",
    "cryptography==42.0",
]

[project.scripts]
hiddify_support_bot = "hiddify_support_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hiddify_support_bot"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.vscode",
  "/.venv",
  "/htmlcov",
  "/site",
  "/tests",
]

[tool.hatch.version]
path = "hiddify_support_bot/VERSION"
pattern = "(?P<version>\\S+)"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest",
    "coverage",
    "flake8",
    "black",
    "isort",
    "pytest-cov",
    "mypy",
    "gitchangelog",
    "mkdocs",
]
